name: Claude Code Review

on:
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Claude review
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot]"
          prompt: |
            Repository: ${{ github.repository }}
            Pull request: #${{ github.event.pull_request.number }}
            Author: ${{ github.event.pull_request.user.login }}

            This pull request was just opened or updated. Review it and submit exactly one FORMAL review (never a plain comment). Write everything in English.

            ## How to review

            1. Read the PR title and body (`gh pr view`), then the full diff (`gh pr diff`).
            2. Before asserting anything about code you cannot see in the diff, open it: the surrounding function, the callers, the tests, the project rules in `CLAUDE.md`. A claim you did not verify against the repository is not a finding.
            3. Find the spec: the issue named by `Closes #N` in the body (`gh issue view N --comments`), its `Scope` and `Acceptance` sections first. No linked issue: the PR body is the spec.
            4. Review along two separate axes, and keep them separate in the review body:
               - **Spec**: does the diff do what the spec asks? A requirement missing, partial, or implemented wrongly is a finding; quote the spec line. Behaviour the spec did not ask for is never a finding.
               - **Standards**: does the diff follow this repository's rules (`CLAUDE.md`, `.claude/docs/decisions/backend-conventions.md`, `.claude/docs/decisions/web-frontend-rules.md`)? Skip anything a compiler, analyzer, test or CI script already enforces.

            ## What counts as BLOCKING

            - A bug or logic error in the changed code.
            - A security issue (injection, auth bypass, secret exposure, unsafe deserialisation, SSRF).
            - A path that loses or corrupts data (a migration dropping a column still read, a retention query wider than intended, a replace-by-scope aggregate that would wipe frozen patches).
            - A regression: existing behaviour changed without the PR saying so.
            - Changed behaviour with no test when the surrounding code is tested, or a test that no longer asserts what its name says.
            - A project rule CI cannot catch: a read query missing `AsNoTracking` on a `DbSet` it touches, a snake_case column name, an entity or configuration change without the regenerated compiled model in `backend/Data/CompiledModels`, a cache entry written without `Size`, a patch filter bypassing `PatchFilter`, a user-facing feature added or removed without updating `.claude/docs/features.md` and `.claude/docs/decisions.md`.

            ## Report blocking points only

            Post nothing that is not BLOCKING: no suggestions, no nits, no praise, no summary of the change. Style, naming, formatting, code smells, "could also", defence in depth, micro-optimisations, alternative designs, and anything the PR body or a code comment says is intentional are never posted.

            ## Rules against false positives

            - Never claim a dependency, GitHub Action, tool or runtime version does not exist or is wrong based on your own knowledge: versions in this repository are often newer than your training data. Only the lockfile, `Directory.Packages.props`, `package.json` or an explicit failure in the diff is evidence.
            - Never claim a library API is wrong or unavailable unless you found the contradiction in the repository.
            - Never re-raise a point already answered in a review thread or documented as a deliberate decision (`.claude/docs/decisions.md`, a code comment, the PR body).
            - Never invent problems to have something to say. A clean PR gets an approval with an empty body.

            ## Dependency update PRs (Dependabot)

            Check that the lockfile change matches the version in the title, that no unrelated package moved, and read the diff of `package.json` or `Directory.Packages.props` for a major bump that would need code changes. If nothing is blocking, approve.

            ## Output

            Submit exactly ONE formal review with `gh pr review ${{ github.event.pull_request.number }}`:
            - no BLOCKING point: `gh pr review ${{ github.event.pull_request.number }} --approve` with no body and no inline comment;
            - at least one BLOCKING point: first one inline comment per point on the exact line, starting with `BLOCKING:`, stating the problem, why it matters and the fix in one or two sentences; then `--request-changes` with a body listing those points, one line each, grouped under `Spec:` and `Standards:`.
            Do not post a summary comment in addition to the review.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
