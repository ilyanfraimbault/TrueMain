name: Deploy Prod

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/truemain-api
  IMAGE_INGESTOR: ghcr.io/${{ github.repository_owner }}/truemain-ingestor
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/truemain-web
  IMAGE_ADMIN: ghcr.io/${{ github.repository_owner }}/truemain-admin

jobs:
  publish:
    name: Build & Publish Release Images
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: backend/Api/Dockerfile
          push: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          tags: |
            ${{ env.IMAGE_API }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE_API }}:latest

      - name: Build and push Ingestor image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: backend/Ingestor/Dockerfile
          push: true
          cache-from: type=gha,scope=ingestor
          cache-to: type=gha,mode=max,scope=ingestor
          tags: |
            ${{ env.IMAGE_INGESTOR }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE_INGESTOR }}:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: web/Dockerfile
          push: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          tags: |
            ${{ env.IMAGE_WEB }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE_WEB }}:latest

      - name: Build and push Admin image
        uses: docker/build-push-action@v7
        with:
          context: ./admin
          file: admin/Dockerfile
          push: true
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
          tags: |
            ${{ env.IMAGE_ADMIN }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE_ADMIN }}:latest

  migrate-prod:
    name: Apply Prod Migrations
    runs-on: ubuntu-24.04
    needs: publish
    if: success()
    concurrency:
      group: migrate-prod
      cancel-in-progress: false

    steps:
      - name: Require PROD_SSH_HOST / PROD_SSH_KEY
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -z "$PROD_SSH_HOST" ] || [ -z "$PROD_SSH_KEY" ]; then
            echo "::error::PROD_SSH_HOST/PROD_SSH_KEY are unset — refusing to let deploy-prod proceed against a possibly-unmigrated schema. Set both secrets (see docs/prod.md)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - name: Restore Data project
        working-directory: backend
        run: dotnet restore Data/Data.csproj

      - name: Generate idempotent migration script
        working-directory: backend
        env:
          ConnectionStrings__TrueMain: Host=localhost;Port=5432;Database=truemain;Username=truemain;Password=truemain
        run: |
          dotnet ef migrations script --idempotent \
            --project Data/Data.csproj --startup-project Data/Data.csproj \
            --output "$RUNNER_TEMP/migration.sql"

      - name: Print migration script
        run: |
          echo "::group::migration.sql"
          cat "$RUNNER_TEMP/migration.sql"
          echo "::endgroup::"

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: prod-migration-${{ github.event.release.tag_name }}
          path: ${{ runner.temp }}/migration.sql
          retention-days: 90

      - name: Apply migration script over SSH
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_HOST_KEY: ${{ vars.PROD_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod_ed25519
          chmod 600 ~/.ssh/prod_ed25519
          printf '%s\n' "$PROD_SSH_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/prod_ed25519 -o StrictHostKeyChecking=yes "root@${PROD_SSH_HOST}" \
            < "$RUNNER_TEMP/migration.sql"

  deploy-prod:
    name: Deploy Prod VPS
    runs-on: ubuntu-24.04
    needs: [publish, migrate-prod]
    if: success() && vars.HOSTINGER_PROD_VM_ID != ''
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Guard on PROD_ENV_FILE
        id: guard
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          if [ -z "$PROD_ENV_FILE" ]; then
            echo "::warning::PROD_ENV_FILE is empty — skipping prod deploy to avoid wiping the VPS .env. Set the secret to enable auto-deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Redeploy Docker Manager project
        if: steps.guard.outputs.ready == 'true'
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_PROD_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_PROD_VM_ID }}
          project-name: truemain
          docker-compose-path: compose.prod.yaml
          environment-variables: |
            ${{ secrets.PROD_ENV_FILE }}
            IMAGE_TAG=${{ github.event.release.tag_name }}
