name: Deploy Prod

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

# Workflow-level, mirroring deploy-preprod.yml: two releases published back to
# back would otherwise interleave their `publish` jobs and race for the moving
# `:latest` tag, leaving it pointing at whichever build finished last rather
# than at the newest release. `cancel-in-progress: false` lets a running
# deployment finish; GitHub still collapses the pending queue to the newest
# run, so a burst of releases ends on the latest one — and a collapsed run is
# visibly cancelled, never a silent half-deploy.
concurrency:
  group: prod-pipeline
  cancel-in-progress: false
jobs:
  # Gate for the whole pipeline. Every later job assumes a complete deployment
  # configuration, so it is checked once, up front, before anything mutates
  # prod. This job exists because the previous shape checked the deploy-side
  # configuration *after* `migrate-prod` had already run: an empty
  # PROD_ENV_FILE produced a green skip and an unset HOSTINGER_PROD_VM_ID
  # skipped the deploy job entirely, in both cases leaving prod running the old
  # binary against a freshly migrated schema — the exact mismatch
  # docs/production-migrations.md says this pipeline exists to prevent.
  # Failing here instead is loud, costs nothing, and leaves prod untouched.
  preflight:
    name: Preflight Deployment Configuration
    runs-on: ubuntu-24.04

    steps:
      - name: Require the full prod deployment configuration
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          HOSTINGER_PROD_API_KEY: ${{ secrets.HOSTINGER_PROD_API_KEY }}
          HOSTINGER_PROD_VM_ID: ${{ vars.HOSTINGER_PROD_VM_ID }}
        run: |
          set -uo pipefail
          missing=""
          for name in PROD_SSH_HOST PROD_SSH_KEY PROD_ENV_FILE HOSTINGER_PROD_API_KEY HOSTINGER_PROD_VM_ID; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Incomplete prod deployment configuration —${missing}. Refusing to migrate or roll prod: applying migrations without rolling the images (or the reverse) leaves prod on a mismatched schema. Set the missing secrets/variables (see docs/prod.md) and re-run this workflow."
            exit 1
          fi
          echo "Prod deployment configuration is complete." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build & Publish Release Images
    # Also gated: `publish` moves the `:latest` tag, so publishing without
    # being able to deploy would leave `:latest` ahead of what prod runs.
    needs: preflight
    uses: ./.github/workflows/build-images.yml
    with:
      # The release tag, not the triggering ref: a release can be published
      # from a tag that is no longer the tip of any branch.
      ref: ${{ github.event.release.tag_name }}
      tags: |
        ${{ github.event.release.tag_name }}
        latest

  migrate-prod:
    name: Apply Prod Migrations
    runs-on: ubuntu-24.04
    needs: [preflight, publish]
    if: success()
    concurrency:
      group: migrate-prod
      cancel-in-progress: false

    steps:
      # The SSH-secret check that used to live here moved into `preflight`,
      # together with the deploy-side checks, so an incomplete configuration
      # blocks the migration instead of orphaning it.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - name: Restore Data project
        working-directory: backend
        run: dotnet restore Data/Data.csproj

      - name: Generate idempotent migration script
        working-directory: backend
        env:
          ConnectionStrings__TrueMain: Host=localhost;Port=5432;Database=truemain;Username=truemain;Password=truemain
        run: |
          dotnet ef migrations script --idempotent \
            --project Data/Data.csproj --startup-project Data/Data.csproj \
            --output "$RUNNER_TEMP/migration.sql"

      - name: Print migration script
        run: |
          echo "::group::migration.sql"
          cat "$RUNNER_TEMP/migration.sql"
          echo "::endgroup::"

      - name: Upload migration script
        uses: actions/upload-artifact@v7
        with:
          name: prod-migration-${{ github.event.release.tag_name }}
          path: ${{ runner.temp }}/migration.sql
          retention-days: 90

      - name: Apply migration script over SSH
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_HOST_KEY: ${{ vars.PROD_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod_ed25519
          chmod 600 ~/.ssh/prod_ed25519
          printf '%s\n' "$PROD_SSH_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/prod_ed25519 -o StrictHostKeyChecking=yes "root@${PROD_SSH_HOST}" \
            < "$RUNNER_TEMP/migration.sql"

  deploy-prod:
    name: Deploy Prod VPS
    runs-on: ubuntu-24.04
    needs: [preflight, publish, migrate-prod]
    # `success()` must be explicit — a custom `if:` would replace the implicit
    # needs-succeeded check. HOSTINGER_PROD_VM_ID and PROD_ENV_FILE are no
    # longer tested here: `preflight` already failed the run if either is
    # missing, so reaching this job means the configuration is complete and a
    # skip can no longer masquerade as a successful release.
    if: success()
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Redeploy Docker Manager project
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_PROD_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_PROD_VM_ID }}
          project-name: truemain
          docker-compose-path: compose.prod.yaml
          # APP_VERSION rides the same channel as IMAGE_TAG into
          # NUXT_PUBLIC_APP_VERSION, so the prod footer states the release it is
          # serving — the counterpart of the `-rc.N` stamp on preprod, and what
          # makes "is this in prod yet?" answerable from the page itself.
          environment-variables: |
            ${{ secrets.PROD_ENV_FILE }}
            IMAGE_TAG=${{ github.event.release.tag_name }}
            APP_VERSION=${{ github.event.release.tag_name }}
