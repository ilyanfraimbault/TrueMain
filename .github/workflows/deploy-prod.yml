name: Deploy Prod

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

concurrency:
  group: prod-pipeline
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight deployment configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require the full prod deployment configuration
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          HOSTINGER_PROD_API_KEY: ${{ secrets.HOSTINGER_PROD_API_KEY }}
          HOSTINGER_PROD_VM_ID: ${{ vars.HOSTINGER_PROD_VM_ID }}
        run: |
          set -uo pipefail
          missing=""
          for name in PROD_SSH_HOST PROD_SSH_KEY PROD_ENV_FILE HOSTINGER_PROD_API_KEY HOSTINGER_PROD_VM_ID; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Incomplete prod deployment configuration:${missing}. Set the missing secrets/variables (docs/prod.md) and re-run."
            exit 1
          fi
          echo "Prod deployment configuration is complete." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build and publish release images
    needs: preflight
    uses: ./.github/workflows/build-images.yml
    with:
      ref: ${{ github.event.release.tag_name }}
      tags: |
        ${{ github.event.release.tag_name }}
        latest

  rollout:
    name: Roll out prod
    needs: publish
    uses: ./.github/workflows/rollout.yml
    with:
      environment: prod
      ref: ${{ github.event.release.tag_name }}
      project_name: truemain
      compose_file: compose.prod.yaml
      image_tag: ${{ github.event.release.tag_name }}
      app_version: ${{ github.event.release.tag_name }}
      ssh_host_key: ${{ vars.PROD_SSH_HOST_KEY }}
      vm_id: ${{ vars.HOSTINGER_PROD_VM_ID }}
    secrets:
      ssh_host: ${{ secrets.PROD_SSH_HOST }}
      ssh_key: ${{ secrets.PROD_SSH_KEY }}
      hostinger_api_key: ${{ secrets.HOSTINGER_PROD_API_KEY }}
      env_file: ${{ secrets.PROD_ENV_FILE }}
