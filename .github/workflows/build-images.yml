name: Build Images

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      tags:
        required: true
        type: string

jobs:
  build:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            image: truemain-api
            context: ./backend
            file: backend/Api/Dockerfile
            scope: api
          - name: Ingestor
            image: truemain-ingestor
            context: ./backend
            file: backend/Ingestor/Dockerfile
            scope: ingestor
          - name: Web
            image: truemain-web
            context: ./web
            file: web/Dockerfile
            scope: web
          - name: Admin
            image: truemain-admin
            context: ./admin
            file: admin/Dockerfile
            scope: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose the image references
        id: refs
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t values <<< "${TAGS%$'\n'}"
          refs=""
          for value in "${values[@]}"; do
            if [ -z "$value" ]; then
              echo "::error::Empty tag in the 'tags' input, refusing to publish an incomplete tag list."
              exit 1
            fi
            refs+="${IMAGE}:${value}"$'\n'
          done
          printf 'refs<<IMAGE_REFS_EOF\n%sIMAGE_REFS_EOF\n' "$refs" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${refs}"

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          tags: ${{ steps.refs.outputs.refs }}
