name: Build Images

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      tags:
        required: true
        type: string

jobs:
  build:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            image: truemain-api
            context: ./backend
            file: backend/Api/Dockerfile
            scope: api
          - name: Ingestor
            image: truemain-ingestor
            context: ./backend
            file: backend/Ingestor/Dockerfile
            scope: ingestor
          - name: Web
            image: truemain-web
            context: ./web
            file: web/Dockerfile
            scope: web
          - name: Admin
            image: truemain-admin
            context: ./admin
            build_contexts: web=./web
            file: admin/Dockerfile
            scope: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose the image references
        id: refs
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t values <<< "${TAGS%$'\n'}"
          refs=""
          for value in "${values[@]}"; do
            if [ -z "$value" ]; then
              echo "::error::Empty tag in the 'tags' input, refusing to publish an incomplete tag list."
              exit 1
            fi
            refs+="${IMAGE}:${value}"$'\n'
          done
          printf 'refs<<IMAGE_REFS_EOF\n%sIMAGE_REFS_EOF\n' "$refs" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${refs}"

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.build_contexts }}
          file: ${{ matrix.file }}
          push: true
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          tags: ${{ steps.refs.outputs.refs }}
