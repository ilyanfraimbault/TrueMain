name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      data: ${{ steps.plan.outputs.data }}
      compose: ${{ steps.plan.outputs.compose }}
      scripts: ${{ steps.plan.outputs.scripts }}
      frontend_apps: ${{ steps.plan.outputs.frontend_apps }}
      images: ${{ steps.plan.outputs.images }}

    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ci:
              - ".github/workflows/ci.yml"
              - ".github/actions/**"
            backend:
              - "backend/**"
            data:
              - "backend/Data/**"
            web:
              - "web/**"
            admin:
              - "admin/**"
            compose:
              - "compose*.yaml"
              - ".env*.example"
            scripts:
              - ".github/scripts/**"

      - name: Plan the jobs
        id: plan
        env:
          EXHAUSTIVE: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ci == 'true' }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          DATA: ${{ steps.filter.outputs.data }}
          WEB: ${{ steps.filter.outputs.web }}
          ADMIN: ${{ steps.filter.outputs.admin }}
          COMPOSE: ${{ steps.filter.outputs.compose }}
          SCRIPTS: ${{ steps.filter.outputs.scripts }}
        run: |
          set -euo pipefail
          flag() { if [ "$EXHAUSTIVE" = "true" ] || [ "$1" = "true" ]; then echo true; else echo false; fi; }
          backend="$(flag "$BACKEND")"
          data="$(flag "$DATA")"
          web="$(flag "$WEB")"
          admin="$(flag "$ADMIN")"
          compose="$(flag "$COMPOSE")"
          scripts="$(flag "$SCRIPTS")"

          apps='[]'
          [ "$web" = true ] && apps="$(jq -c '. + ["web"]' <<< "$apps")"
          [ "$admin" = true ] && apps="$(jq -c '. + ["admin"]' <<< "$apps")"

          images='[]'
          add_image() {
            images="$(jq -c --arg n "$1" --arg c "$2" --arg f "$3" --arg s "$4" \
              '. + [{name: $n, context: $c, file: $f, scope: $s}]' <<< "$images")"
          }
          [ "$backend" = true ] && add_image API ./backend backend/Api/Dockerfile api
          [ "$backend" = true ] && add_image Ingestor ./backend backend/Ingestor/Dockerfile ingestor
          [ "$web" = true ] && add_image Web ./web web/Dockerfile web
          [ "$admin" = true ] && add_image Admin ./admin admin/Dockerfile admin

          {
            echo "backend=$backend"
            echo "data=$data"
            echo "compose=$compose"
            echo "scripts=$scripts"
            echo "frontend_apps=$apps"
            echo "images=$images"
          } | tee -a "$GITHUB_OUTPUT"

  backend:
    name: Backend build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore solution
        run: dotnet restore TrueMain.sln

      - name: Build solution
        run: dotnet build TrueMain.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/TrueMain.UnitTests/TrueMain.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Integration tests
        run: dotnet test tests/TrueMain.IntegrationTests/TrueMain.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

  migrate-fresh:
    name: Migrations on a fresh database
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.data == 'true'

    services:
      postgres:
        image: postgres:17.2
        env:
          POSTGRES_USER: truemain
          POSTGRES_PASSWORD: truemain
          POSTGRES_DB: truemain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truemain -d truemain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGPASSWORD: truemain

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate migration script
        id: script
        uses: ./.github/actions/migration-script

      - name: Apply script to a blank database
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U truemain -d truemain \
            --single-transaction -f "${{ steps.script.outputs.path }}"

      - name: Re-apply the script (must be a no-op)
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U truemain -d truemain \
            --single-transaction -f "${{ steps.script.outputs.path }}"

      - name: Assert every migration is recorded
        run: |
          expected=$(find backend/Data/Migrations -name '*.cs' \
            -not -name '*.Designer.cs' -not -name '*ModelSnapshot.cs' | wc -l)
          actual=$(psql -t -A -h localhost -p 5432 -U truemain -d truemain \
            -c 'SELECT count(*) FROM "__EFMigrationsHistory";')
          echo "migrations on disk: $expected, rows in __EFMigrationsHistory: $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::__EFMigrationsHistory has $actual rows but $expected migrations exist on disk."
            exit 1
          fi

  frontend:
    name: Frontend build and test (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.frontend_apps != '[]'

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.frontend_apps) }}

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Pin npm
        run: npm install -g npm@11.13.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Nuxt app
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build Nuxt app
        run: npm run build

  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.scripts == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preprod version resolver
        run: .github/scripts/resolve-preprod-version.test.sh

      - name: Rollout verification
        run: .github/scripts/verify-rollout.test.sh

  compose-config:
    name: Compose config validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.compose == 'true'

    env:
      PGADMIN_DEFAULT_PASSWORD: admin
      OPS_API_KEY: ci-ops-api-key-min-32-characters-padding
      ADMIN_SESSION_PASSWORD: ci-admin-session-min-32-characters-padding
      ADMIN_USERNAME: truemain
      ADMIN_PASSWORD: truemain
      UMAMI_APP_SECRET: ci-umami-app-secret-min-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate every compose file
        run: |
          set -uo pipefail
          failed=""
          validate() {
            local file="$1" stack="$2" riot_key="$3" pgadmin_email="$4"
            if POSTGRES_USER="$stack" POSTGRES_PASSWORD="$stack" POSTGRES_DB="$stack" \
               MONGO_USER="$stack" MONGO_PASSWORD="$stack" UMAMI_DB_PASSWORD="$stack" \
               RIOT_API_KEY="$riot_key" PGADMIN_DEFAULT_EMAIL="$pgadmin_email" \
               docker compose -f "$file" config > /dev/null; then
              echo "ok: $file"
            else
              echo "::error file=$file::$file does not render"
              failed="${failed} ${file}"
            fi
          }
          validate compose.yaml truemain RGAPI-REPLACE_ME admin@truemain.dev
          validate compose.dev.yaml truemain RGAPI-REPLACE_ME admin@truemain.dev
          validate compose.prod.yaml truemain RGAPI-REPLACE_ME admin@truemain.dev
          validate compose.preprod.yaml truemain_preprod RGAPI-REPLACE_ME_PREPROD admin@truemain-preprod.dev
          if [ -n "$failed" ]; then
            echo "::error::Invalid compose files:${failed}"
            exit 1
          fi

  docker-build:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.images != '[]'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
