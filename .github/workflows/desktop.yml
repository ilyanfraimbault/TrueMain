name: Desktop

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["desktop/**", "web/layers/common/**", "web/shared/**", ".github/workflows/desktop.yml"]
  push:
    branches: [develop, master]
    paths: ["desktop/**", "web/layers/common/**", "web/shared/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      crates: ${{ steps.plan.outputs.crates }}
      shell: ${{ steps.plan.outputs.shell }}
      macos: ${{ steps.plan.outputs.macos }}
      overlay: ${{ steps.plan.outputs.overlay }}
      app: ${{ steps.plan.outputs.app }}

    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            workflow:
              - ".github/workflows/desktop.yml"
            cargo:
              - "desktop/Cargo.toml"
              - "desktop/Cargo.lock"
            crates:
              - "desktop/crates/**"
              - "desktop/capture/windows/**"
            shell:
              - "desktop/src-tauri/**"
            macos:
              - "desktop/capture/macos/**"
            overlay:
              - "desktop/app/**"
              - "desktop/tools/overlay-smoke-windows.ps1"
              - "desktop/fixtures/**"
            app:
              - "desktop/app/**"
              - "web/layers/common/**"
              - "web/shared/**"

      - name: Plan the jobs
        id: plan
        env:
          EXHAUSTIVE: ${{ github.event_name != 'pull_request' || steps.filter.outputs.workflow == 'true' }}
          CARGO: ${{ steps.filter.outputs.cargo }}
          CRATES: ${{ steps.filter.outputs.crates }}
          SHELL_CHANGED: ${{ steps.filter.outputs.shell }}
          MACOS: ${{ steps.filter.outputs.macos }}
          OVERLAY: ${{ steps.filter.outputs.overlay }}
          APP: ${{ steps.filter.outputs.app }}
        run: |
          set -euo pipefail
          any() {
            [ "$EXHAUSTIVE" = "true" ] && { echo true; return; }
            for v in "$@"; do [ "$v" = "true" ] && { echo true; return; }; done
            echo false
          }
          {
            echo "crates=$(any "$CARGO" "$CRATES")"
            echo "shell=$(any "$CARGO" "$CRATES" "$SHELL_CHANGED")"
            echo "macos=$(any "$CARGO" "$CRATES" "$SHELL_CHANGED" "$MACOS")"
            echo "overlay=$(any "$CARGO" "$CRATES" "$SHELL_CHANGED" "$OVERLAY")"
            echo "app=$(any "$APP")"
          } | tee -a "$GITHUB_OUTPUT"

  lcu:
    name: Rust crates
    needs: changes
    if: needs.changes.outputs.crates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: desktop
      - run: cargo fmt --manifest-path desktop/Cargo.toml -p lcu -p live-client -p shell-state -p game-recording -p capture-helper -p capture-spike -p truemain-capture -- --check
      - run: cargo clippy --manifest-path desktop/Cargo.toml -p lcu -p live-client -p shell-state -p game-recording -p capture-helper -p capture-spike -p truemain-capture --all-targets -- -D warnings
      - run: cargo test --manifest-path desktop/Cargo.toml -p lcu -p live-client -p shell-state -p game-recording -p capture-helper -p capture-spike -p truemain-capture

  capture-macos:
    name: macOS capture spike
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: desktop
      - run: swift build -c release --arch arm64 --arch x86_64 --package-path desktop/capture/macos
      - name: Check the shell for macOS
        run: |
          mkdir -p desktop/app/.output/public
          cargo check --manifest-path desktop/Cargo.toml -p truemain-desktop
      - run: cargo build --release --manifest-path desktop/Cargo.toml -p capture-spike --target aarch64-apple-darwin
      - run: cargo build --release --manifest-path desktop/Cargo.toml -p capture-spike --target x86_64-apple-darwin
      - name: Package
        run: |
          bin="$(swift build -c release --arch arm64 --arch x86_64 --package-path desktop/capture/macos --show-bin-path)"
          mkdir -p dist/truemain-capture-spike
          cp "$bin/truemain-capture" dist/truemain-capture-spike/
          lipo -create -output dist/truemain-capture-spike/truemain-capture-spike \
            desktop/target/aarch64-apple-darwin/release/truemain-capture-spike \
            desktop/target/x86_64-apple-darwin/release/truemain-capture-spike
          codesign --force --sign - dist/truemain-capture-spike/truemain-capture dist/truemain-capture-spike/truemain-capture-spike
          lipo -archs dist/truemain-capture-spike/truemain-capture
          lipo -archs dist/truemain-capture-spike/truemain-capture-spike
          { dist/truemain-capture-spike/truemain-capture || true; } | grep -q "\"kind\":\"usage\""
          if dist/truemain-capture-spike/truemain-capture-spike --help; then exit 1; fi
          tar -czf truemain-capture-spike-macos.tar.gz -C dist truemain-capture-spike
      - uses: actions/upload-artifact@v7
        with:
          name: truemain-capture-spike-macos
          path: truemain-capture-spike-macos.tar.gz
          retention-days: 30

  capture-windows:
    name: Windows capture helper and shell
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: desktop
      - run: cargo clippy --manifest-path desktop/Cargo.toml -p truemain-capture -p capture-helper --all-targets -- -D warnings
      - run: cargo test --manifest-path desktop/Cargo.toml -p truemain-capture -p capture-helper
      - name: Test the shell on Windows
        run: |
          New-Item -ItemType Directory -Force desktop/app/.output/public | Out-Null
          cargo test --manifest-path desktop/Cargo.toml -p truemain-desktop
      - run: cargo build --release --manifest-path desktop/Cargo.toml -p truemain-capture
      - run: pwsh desktop/capture/windows/smoke.ps1 -Helper desktop/target/release/truemain-capture.exe -Out "$env:RUNNER_TEMP/capture-smoke"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: truemain-capture-smoke-windows
          path: ${{ runner.temp }}/capture-smoke
          retention-days: 7
          if-no-files-found: ignore

  overlay-windows:
    name: Windows overlay
    needs: changes
    if: needs.changes.outputs.overlay == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: desktop
      - run: npm ci
        working-directory: desktop/app
      - run: npm run tauri -- build --no-bundle
        working-directory: desktop/app
        env:
          TRUEMAIN_SITE_URL: ${{ secrets.DESKTOP_BETA_SITE_URL }}
      - env:
          TRUEMAIN_SITE_URL: ${{ secrets.DESKTOP_BETA_SITE_URL }}
        run: pwsh desktop/tools/overlay-smoke-windows.ps1 -App desktop/target/release/truemain-desktop.exe -Out "$env:RUNNER_TEMP/overlay-smoke"
      - if: always()
        env:
          TRUEMAIN_SITE_URL: ${{ secrets.DESKTOP_BETA_SITE_URL }}
        run: pwsh desktop/tools/overlay-smoke-windows.ps1 -RedactOnly -Out "$env:RUNNER_TEMP/overlay-smoke"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: truemain-overlay-smoke-windows
          path: ${{ runner.temp }}/overlay-smoke
          retention-days: 7
          if-no-files-found: ignore

  app:
    name: Nuxt app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run generate
