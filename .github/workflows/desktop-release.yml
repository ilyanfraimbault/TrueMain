name: Desktop release

on:
  push:
    branches: [develop]
    paths: ["desktop/**", "web/layers/**", "web/shared/**", "!**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  version:
    name: Versions to build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.read.outputs.version }}
      beta: ${{ steps.read.outputs.beta }}
      flavors: ${{ steps.read.outputs.flavors }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::Desktop builds are published from develop only, not $GITHUB_REF"
            exit 1
          fi
          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          if gh release view "desktop-v$version" --json tagName > /dev/null 2>&1; then exists=true; else exists=false; fi
          resolved=$(.github/scripts/desktop-version.sh "$version" "$GITHUB_RUN_NUMBER" "$exists")
          echo "$resolved" >> "$GITHUB_OUTPUT"
          beta=$(sed -n 's/^beta=//p' <<< "$resolved")
          flavors=""
          if git ls-remote --exit-code --tags origin "refs/tags/desktop-v$beta" > /dev/null; then
            echo "::notice::desktop-v$beta already exists: re-run the workflow instead of its jobs to build a new beta"
          else
            flavors="beta"
          fi
          if grep -qx 'stable=true' <<< "$resolved"; then
            flavors="$flavors stable"
          else
            echo "::notice::desktop-v$version already exists: only the preprod build is made, bump the version to publish a production one"
          fi
          echo "flavors=$flavors" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.flavors != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            bundle: desktop/target/universal-apple-darwin/release/bundle
          - name: Windows
            runner: windows-2025
            rust-targets: ""
            args: --bundles nsis
            bundle: desktop/target/release/bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: npm ci
        working-directory: desktop/app
      - name: Build the capture helper
        if: matrix.name == 'macOS'
        run: |
          swift build -c release --arch arm64 --arch x86_64 --package-path desktop/capture/macos
          bin="$(swift build -c release --arch arm64 --arch x86_64 --package-path desktop/capture/macos --show-bin-path)"
          mkdir -p desktop/src-tauri/binaries
          cp "$bin/truemain-capture" desktop/src-tauri/binaries/truemain-capture
          codesign --force --sign - desktop/src-tauri/binaries/truemain-capture
          lipo -archs desktop/src-tauri/binaries/truemain-capture
      - name: Build the capture helper
        if: matrix.name == 'Windows'
        shell: bash
        run: |
          cargo build --release --manifest-path desktop/Cargo.toml -p truemain-capture
          mkdir -p desktop/src-tauri/binaries
          cp desktop/target/release/truemain-capture.exe desktop/src-tauri/binaries/truemain-capture-x86_64-pc-windows-msvc.exe
      - name: Build the flavours
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BETA_SITE: ${{ secrets.DESKTOP_BETA_SITE_URL }}
          BETA: ${{ needs.version.outputs.beta }}
          FLAVORS: ${{ needs.version.outputs.flavors }}
          BUNDLE: ${{ matrix.bundle }}
        run: |
          for flavor in $FLAVORS; do
            if [ "$flavor" = stable ]; then
              site=https://truemain.lol
              name=truemain
              echo '{}' > desktop/flavor.json
            else
              if ! [[ "$BETA_SITE" =~ ^https?://[^/]+$ ]]; then
                echo "::error::The DESKTOP_BETA_SITE_URL secret must be preprod's site origin (scheme and host, no path)"
                exit 1
              fi
              site=$BETA_SITE
              name="truemain-$BETA"
              SITE="$site" node -e '
                const site = process.env.SITE
                console.log(JSON.stringify({
                  version: process.env.BETA,
                  productName: "TrueMain Beta",
                  identifier: "gg.truemain.desktop.beta",
                  plugins: { updater: {
                    endpoints: [`${site}/api/desktop/latest.json`],
                    dangerousInsecureTransportProtocol: site.startsWith("http://"),
                  } },
                }))
              ' > desktop/flavor.json
            fi
            if [ "${{ matrix.name }}" = "Windows" ]; then
              node -e '
                const fs = require("fs")
                const flavor = JSON.parse(fs.readFileSync("desktop/flavor.json", "utf8"))
                flavor.bundle = { ...flavor.bundle, externalBin: ["binaries/truemain-capture"] }
                fs.writeFileSync("desktop/flavor.json", JSON.stringify(flavor))
              '
            fi
            out="dist/$flavor"
            mkdir -p "$out"
            rm -rf "$BUNDLE"
            (cd desktop/app && TRUEMAIN_SITE_URL="$site" npm run tauri -- build ${{ matrix.args }} --config flavor.json)
            if [ "${{ matrix.name }}" = "macOS" ]; then
              app=$(ls -d "$BUNDLE"/macos/*.app)
              test -x "$app/Contents/MacOS/truemain-capture"
              codesign --verify --deep --strict "$app"
              cp "$BUNDLE"/dmg/*.dmg "$out/$name.dmg"
              cp "$BUNDLE"/macos/*.app.tar.gz "$out/$name.app.tar.gz"
              cp "$BUNDLE"/macos/*.app.tar.gz.sig "$out/$name.app.tar.gz.sig"
            else
              test -f desktop/target/release/truemain-capture.exe
              cp "$BUNDLE"/nsis/*-setup.exe "$out/$name.exe"
              cp "$BUNDLE"/nsis/*-setup.exe.sig "$out/$name.exe.sig"
            fi
          done
          ls -laR dist
      - if: contains(needs.version.outputs.flavors, 'beta')
        uses: actions/upload-artifact@v7
        with:
          name: desktop-beta-${{ matrix.name }}
          path: dist/beta/*
          if-no-files-found: error
      - if: contains(needs.version.outputs.flavors, 'stable')
        uses: actions/upload-artifact@v7
        with:
          name: desktop-stable-${{ matrix.name }}
          path: dist/stable/*
          if-no-files-found: error

  beta:
    name: Publish the preprod build
    needs: [version, build]
    if: contains(needs.version.outputs.flavors, 'beta')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-beta-*
          path: dist
          merge-multiple: true
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BETA: ${{ needs.version.outputs.beta }}
        run: |
          tag="desktop-v$BETA"
          .github/scripts/desktop-manifest.sh dist "truemain-$BETA" "$BETA" \
            "https://github.com/$GH_REPO/releases/download/$tag" \
            "TrueMain Beta $BETA (${GITHUB_SHA::7})" > dist/latest-beta.json
          cat dist/latest-beta.json
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "TrueMain Beta $BETA" \
            --notes "Preprod build of the desktop companion at $GITHUB_SHA: it reads preprod, which serves it on its download page and in the TrueMain Beta update feed. The installers are not signed yet; the download page says how to open them the first time."
          echo "Published [$tag](https://github.com/$GH_REPO/releases/tag/$tag): preprod serves it within five minutes." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the last ten preprod builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' \
            | grep -E '^desktop-v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$' \
            | sort -V | head -n -10 \
            | while read -r old; do
                gh release delete "$old" --cleanup-tag --yes
                echo "Deleted $old"
              done

  stable:
    name: Publish the production build
    needs: [version, build]
    if: contains(needs.version.outputs.flavors, 'stable')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-stable-*
          path: dist
          merge-multiple: true
      - name: Create the held release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="desktop-v$VERSION"
          .github/scripts/desktop-manifest.sh dist truemain "$VERSION" \
            "https://github.com/$GH_REPO/releases/download/$tag" \
            "TrueMain desktop $VERSION" > dist/latest.json
          cat dist/latest.json
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --draft \
            --latest=false \
            --title "TrueMain desktop $VERSION" \
            --notes "Production build of the desktop companion at $GITHUB_SHA: it reads https://truemain.lol, which serves it once production runs what it reads. The installers are not signed yet; the download page says how to open them the first time."
      - name: Serve it if production runs what it reads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          site=$(gh run list --workflow deploy-prod.yml --event release --status success --limit 50 --json headBranch,updatedAt \
            -q '[.[] | select(.headBranch | startswith("desktop-v") | not)] | sort_by(.updatedAt) | last | .headBranch // empty')
          if [ -z "$site" ]; then
            echo "::notice::No site release is deployed yet: desktop-v$VERSION waits for the first one"
            exit 0
          fi
          echo "Production runs $site"
          .github/scripts/desktop-held.sh "$site"
