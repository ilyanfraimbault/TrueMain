name: Desktop release

on:
  push:
    branches: [develop]
    paths: ["desktop/src-tauri/tauri.conf.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  version:
    name: New app version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      build: ${{ steps.read.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::Desktop builds are published from develop only, not $GITHUB_REF"
            exit 1
          fi
          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$version is not a semantic version (desktop/src-tauri/tauri.conf.json)"
            exit 1
          fi
          tag="desktop-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag already exists: bump the version in desktop/src-tauri/tauri.conf.json to publish a new build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            bundle: desktop/target/universal-apple-darwin/release/bundle
          - name: Windows
            runner: windows-2025
            rust-targets: ""
            args: --bundles nsis
            bundle: desktop/target/release/bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: npm ci
        working-directory: desktop/app
      - name: Build the capture helper
        if: matrix.name == 'macOS'
        run: |
          swift build -c release --arch arm64 --arch x86_64 --package-path desktop/capture/macos
          bin="$(swift build -c release --arch arm64 --arch x86_64 --package-path desktop/capture/macos --show-bin-path)"
          mkdir -p desktop/src-tauri/binaries
          cp "$bin/truemain-capture" desktop/src-tauri/binaries/truemain-capture
          codesign --force --sign - desktop/src-tauri/binaries/truemain-capture
          lipo -archs desktop/src-tauri/binaries/truemain-capture
      - name: Build the capture helper
        if: matrix.name == 'Windows'
        shell: bash
        run: |
          cargo build --release --manifest-path desktop/Cargo.toml -p truemain-capture
          mkdir -p desktop/src-tauri/binaries
          cp desktop/target/release/truemain-capture.exe desktop/src-tauri/binaries/truemain-capture-x86_64-pc-windows-msvc.exe
      - name: Build for production and for preprod
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BETA_SITE: ${{ secrets.DESKTOP_BETA_SITE_URL }}
          VERSION: ${{ needs.version.outputs.version }}
          BUNDLE: ${{ matrix.bundle }}
        run: |
          if ! [[ "$BETA_SITE" =~ ^https?://[^/]+$ ]]; then
            echo "::error::The DESKTOP_BETA_SITE_URL secret must be preprod's site origin (scheme and host, no path)"
            exit 1
          fi
          mkdir -p dist
          for flavor in stable beta; do
            if [ "$flavor" = stable ]; then
              site=https://truemain.lol
              name=truemain
              echo '{}' > desktop/flavor.json
            else
              site=$BETA_SITE
              name="truemain-$VERSION"
              SITE="$site" node -e '
                const site = process.env.SITE
                console.log(JSON.stringify({
                  productName: "TrueMain Beta",
                  identifier: "gg.truemain.desktop.beta",
                  plugins: { updater: {
                    endpoints: [`${site}/api/desktop/latest.json`],
                    dangerousInsecureTransportProtocol: site.startsWith("http://"),
                  } },
                }))
              ' > desktop/flavor.json
            fi
            if [ "${{ matrix.name }}" = "Windows" ]; then
              node -e '
                const fs = require("fs")
                const flavor = JSON.parse(fs.readFileSync("desktop/flavor.json", "utf8"))
                flavor.bundle = { ...flavor.bundle, externalBin: ["binaries/truemain-capture"] }
                fs.writeFileSync("desktop/flavor.json", JSON.stringify(flavor))
              '
            fi
            rm -rf "$BUNDLE"
            (cd desktop/app && TRUEMAIN_SITE_URL="$site" npm run tauri -- build ${{ matrix.args }} --config flavor.json)
            if [ "${{ matrix.name }}" = "macOS" ]; then
              app=$(ls -d "$BUNDLE"/macos/*.app)
              test -x "$app/Contents/MacOS/truemain-capture"
              codesign --verify --deep --strict "$app"
              cp "$BUNDLE"/dmg/*.dmg "dist/$name.dmg"
              cp "$BUNDLE"/macos/*.app.tar.gz "dist/$name.app.tar.gz"
              cp "$BUNDLE"/macos/*.app.tar.gz.sig "dist/$name.app.tar.gz.sig"
            else
              test -f desktop/target/release/truemain-capture.exe
              cp "$BUNDLE"/nsis/*-setup.exe "dist/$name.exe"
              cp "$BUNDLE"/nsis/*-setup.exe.sig "dist/$name.exe.sig"
            fi
          done
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the pre-release
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write the update manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}
        run: |
          manifest() {
            local name=$1 notes=$2
            jq -n \
              --arg version "$VERSION" --arg notes "$notes" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg macSig "$(cat "dist/$name.app.tar.gz.sig")" --arg macUrl "$BASE/$name.app.tar.gz" \
              --arg winSig "$(cat "dist/$name.exe.sig")" --arg winUrl "$BASE/$name.exe" \
              '{version: $version, notes: $notes, pub_date: $date, platforms: {
                "darwin-aarch64": {signature: $macSig, url: $macUrl},
                "darwin-x86_64": {signature: $macSig, url: $macUrl},
                "windows-x86_64": {signature: $winSig, url: $winUrl}
              }}'
          }
          manifest truemain "TrueMain desktop $VERSION" > dist/latest.json
          manifest "truemain-$VERSION" "TrueMain desktop $VERSION (preprod build)" > dist/latest-beta.json
          cat dist/latest.json dist/latest-beta.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "TrueMain desktop $VERSION (beta)" \
            --notes "Desktop companion build, in two flavours: \`truemain-$VERSION.*\` reads preprod and is served on preprod's download page; \`truemain.*\` reads https://truemain.lol and is served there once the Desktop promote workflow promotes this version. The installers are not signed yet; the download page says how to open them the first time."
          echo "Published [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG) as a pre-release: preprod serves it now, run **Desktop promote** with \`$VERSION\` to serve it on truemain.lol." >> "$GITHUB_STEP_SUMMARY"
