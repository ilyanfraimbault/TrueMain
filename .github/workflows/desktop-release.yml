name: Desktop release

on:
  push:
    branches: [develop]
    paths: ["desktop/src-tauri/tauri.conf.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  version:
    name: New app version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      build: ${{ steps.read.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::Desktop builds are published from develop only, not $GITHUB_REF"
            exit 1
          fi
          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$version is not a semantic version (desktop/src-tauri/tauri.conf.json)"
            exit 1
          fi
          tag="desktop-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag already exists: bump the version in desktop/src-tauri/tauri.conf.json to publish a new build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            bundle: desktop/target/universal-apple-darwin/release/bundle
          - name: Windows
            runner: windows-2025
            rust-targets: ""
            args: --bundles nsis
            bundle: desktop/target/release/bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: npm ci
        working-directory: desktop/app
      - run: npm run tauri -- build ${{ matrix.args }}
        working-directory: desktop/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Collect the installers
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUNDLE: ${{ matrix.bundle }}
        run: |
          mkdir -p dist
          if [ "${{ matrix.name }}" = "macOS" ]; then
            cp "$BUNDLE"/dmg/*.dmg "dist/TrueMain_${VERSION}_universal.dmg"
            cp "$BUNDLE/macos/TrueMain.app.tar.gz" "dist/TrueMain_${VERSION}_universal.app.tar.gz"
            cp "$BUNDLE/macos/TrueMain.app.tar.gz.sig" "dist/TrueMain_${VERSION}_universal.app.tar.gz.sig"
          else
            cp "$BUNDLE"/nsis/*-setup.exe "dist/TrueMain_${VERSION}_x64-setup.exe"
            cp "$BUNDLE"/nsis/*-setup.exe.sig "dist/TrueMain_${VERSION}_x64-setup.exe.sig"
          fi
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the pre-release
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write the update manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}
        run: |
          mac="TrueMain_${VERSION}_universal.app.tar.gz"
          win="TrueMain_${VERSION}_x64-setup.exe"
          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg macSig "$(cat "dist/$mac.sig")" --arg macUrl "$BASE/$mac" \
            --arg winSig "$(cat "dist/$win.sig")" --arg winUrl "$BASE/$win" \
            '{version: $version, notes: "TrueMain desktop \($version) (beta)", pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $macSig, url: $macUrl},
              "darwin-x86_64": {signature: $macSig, url: $macUrl},
              "windows-x86_64": {signature: $winSig, url: $winUrl}
            }}' > dist/latest.json
          cat dist/latest.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "TrueMain desktop $VERSION (beta)" \
            --notes "Desktop companion beta build, served on preprod until it is promoted to https://truemain.lol/download by the Desktop promote workflow. The installers are not signed yet; the download page says how to open them the first time."
          echo "Published [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG) as a pre-release: preprod serves it now, run **Desktop promote** with \`$VERSION\` to serve it on truemain.lol." >> "$GITHUB_STEP_SUMMARY"
