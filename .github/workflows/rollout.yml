name: Rollout

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ''
      project_name:
        required: true
        type: string
      compose_file:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      app_version:
        required: true
        type: string
      ssh_host_key:
        required: true
        type: string
      vm_id:
        required: true
        type: string
    secrets:
      ssh_host:
        required: true
      ssh_key:
        required: true
      hostinger_api_key:
        required: true
      env_file:
        required: true

jobs:
  migrate:
    name: Apply ${{ inputs.environment }} migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Generate migration script
        id: script
        uses: ./.github/actions/migration-script

      - name: Print migration script
        run: |
          echo "::group::migration.sql"
          cat "${{ steps.script.outputs.path }}"
          echo "::endgroup::"

      - name: Upload migration script
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.environment }}-migration-${{ inputs.image_tag }}
          path: ${{ steps.script.outputs.path }}
          retention-days: 90

      - name: Install SSH credentials
        id: ssh
        uses: ./.github/actions/ssh-credentials
        with:
          key: ${{ secrets.ssh_key }}
          host_key: ${{ inputs.ssh_host_key }}

      - name: Apply migration script over SSH
        env:
          SSH_HOST: ${{ secrets.ssh_host }}
          SSH_IDENTITY: ${{ steps.ssh.outputs.identity }}
          SCRIPT: ${{ steps.script.outputs.path }}
        run: |
          ssh -i "$SSH_IDENTITY" -o StrictHostKeyChecking=yes "root@${SSH_HOST}" < "$SCRIPT"

  deploy:
    name: Deploy ${{ inputs.environment }} VPS
    runs-on: ubuntu-24.04
    needs: migrate
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install SSH credentials
        id: ssh
        uses: ./.github/actions/ssh-credentials
        with:
          key: ${{ secrets.ssh_key }}
          host_key: ${{ inputs.ssh_host_key }}

      - name: Redeploy Docker Manager project
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.hostinger_api_key }}
          virtual-machine: ${{ inputs.vm_id }}
          project-name: ${{ inputs.project_name }}
          docker-compose-path: ${{ inputs.compose_file }}
          environment-variables: |
            ${{ secrets.env_file }}
            IMAGE_TAG=${{ inputs.image_tag }}
            APP_VERSION=${{ inputs.app_version }}

      - name: Verify the VPS is running the deployed images
        env:
          SSH_HOST: ${{ secrets.ssh_host }}
          SSH_IDENTITY: ${{ steps.ssh.outputs.identity }}
          COMPOSE_FILE: ${{ inputs.compose_file }}
          EXPECTED_TAG: ${{ inputs.image_tag }}
          TIMEOUT_SECONDS: '600'
          POLL_SECONDS: '15'
        run: .github/scripts/verify-rollout.sh
