name: Deploy Preprod

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: preprod-pipeline
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight deployment configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require the full preprod deployment configuration
        env:
          PREPROD_SSH_HOST: ${{ secrets.PREPROD_SSH_HOST }}
          PREPROD_SSH_KEY: ${{ secrets.PREPROD_SSH_KEY }}
          PREPROD_ENV_FILE: ${{ secrets.PREPROD_ENV_FILE }}
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          HOSTINGER_PREPROD_VM_ID: ${{ vars.HOSTINGER_PREPROD_VM_ID }}
        run: |
          set -uo pipefail
          missing=""
          for name in PREPROD_SSH_HOST PREPROD_SSH_KEY PREPROD_ENV_FILE HOSTINGER_API_KEY HOSTINGER_PREPROD_VM_ID; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Incomplete preprod deployment configuration:${missing}. Set the missing secrets/variables (docs/preprod.md) and re-run."
            exit 1
          fi
          echo "Preprod deployment configuration is complete." >> "$GITHUB_STEP_SUMMARY"

  version:
    name: Resolve preprod version
    runs-on: ubuntu-24.04
    needs: preflight
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the prerelease version
        id: resolve
        env:
          PREPROD_VERSION_BASE: ${{ vars.PREPROD_VERSION_BASE }}
        run: |
          set -euo pipefail
          version="$(.github/scripts/resolve-preprod-version.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Preprod version: ${version}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build and publish preprod images
    needs: version
    uses: ./.github/workflows/build-images.yml
    with:
      tags: |
        preprod
        ${{ github.sha }}
        ${{ needs.version.outputs.version }}

  rollout:
    name: Roll out preprod
    needs: [version, publish]
    uses: ./.github/workflows/rollout.yml
    with:
      environment: preprod
      project_name: truemain-preprod
      compose_file: compose.preprod.yaml
      image_tag: ${{ github.sha }}
      app_version: ${{ needs.version.outputs.version }}
      ssh_host_key: ${{ vars.PREPROD_SSH_HOST_KEY }}
      vm_id: ${{ vars.HOSTINGER_PREPROD_VM_ID }}
    secrets:
      ssh_host: ${{ secrets.PREPROD_SSH_HOST }}
      ssh_key: ${{ secrets.PREPROD_SSH_KEY }}
      hostinger_api_key: ${{ secrets.HOSTINGER_API_KEY }}
      env_file: ${{ secrets.PREPROD_ENV_FILE }}

  tag:
    name: Tag preprod release
    runs-on: ubuntu-24.04
    needs: [version, rollout]
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push the prerelease tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::notice::${VERSION} already exists, nothing to do."
            exit 0
          fi
          git tag "${VERSION}" "${GITHUB_SHA}"
          git push origin "${VERSION}"
          echo "Tagged ${GITHUB_SHA} as ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
