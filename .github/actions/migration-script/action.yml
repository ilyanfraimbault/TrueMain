name: Generate migration script
description: Generates the idempotent EF Core SQL migration script of the Data project.

outputs:
  path:
    description: Path of the generated SQL file.
    value: ${{ steps.generate.outputs.path }}

runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Install EF Core CLI
      shell: bash
      run: dotnet tool install --global dotnet-ef --version 10.0.10

    - name: Restore Data project
      shell: bash
      working-directory: backend
      run: dotnet restore Data/Data.csproj

    - name: Generate idempotent migration script
      id: generate
      shell: bash
      working-directory: backend
      env:
        ConnectionStrings__TrueMain: Host=localhost;Port=5432;Database=truemain;Username=truemain;Password=truemain
      run: |
        dotnet ef migrations script --idempotent \
          --project Data/Data.csproj --startup-project Data/Data.csproj \
          --output "$RUNNER_TEMP/migration.sql"
        echo "path=$RUNNER_TEMP/migration.sql" >> "$GITHUB_OUTPUT"
