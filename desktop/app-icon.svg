<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The app icon: the site's M-check mark on the app's own ink, full bleed.
       macOS 26 masks the square into its squircle itself, and puts any icon
       that leaves the tile transparent on a white one — which is why the
       favicon's transparent background is not reused here.
       Regenerate every size from desktop/app with `npm run tauri icon app-icon.svg`. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2cfa6"/>
      <stop offset="0.55" stop-color="#e2917e"/>
      <stop offset="1" stop-color="#8a3b44"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="#0b0b0d"/>
  <path d="M16 48V22l14 16L48 16" fill="none" stroke="url(#g)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
