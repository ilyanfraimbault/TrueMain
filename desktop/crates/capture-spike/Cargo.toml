[package]
name = "capture-spike"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Records one League game through the platform capture helper and reports what it measured (spike #1745)."

[[bin]]
name = "truemain-capture-spike"
path = "src/main.rs"

[dependencies]
lcu = { path = "../lcu" }
game-recording = { path = "../game-recording" }
capture-helper = { path = "../capture-helper" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
tempfile = "3"
