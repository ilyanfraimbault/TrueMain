[workspace]
resolver = "2"
members = ["crates/keys", "crates/lcu", "crates/live-client", "crates/shell-state", "crates/game-recording", "crates/capture-helper", "capture/windows", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
thiserror = "2"
tracing = "0.1"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
