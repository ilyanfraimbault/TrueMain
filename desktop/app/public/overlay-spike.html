<!doctype html>
<!-- Spike #1673 only: the page the overlay panel shows. Loaded by
     src-tauri/src/overlay_spike.rs, which exists only with the overlay-spike
     feature. A ticking clock proves the panel still renders over the game; the
     counters prove whether the mouse reaches it. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TrueMain overlay spike</title>
    <style>
      html, body { margin: 0; height: 100%; background: #16121a; color: #f4ece6; font: 13px/1.4 -apple-system, system-ui, sans-serif; user-select: none; cursor: default; }
      body { box-sizing: border-box; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; border: 1px solid #d9a38a; border-radius: 12px; }
      header { display: flex; justify-content: space-between; align-items: baseline; }
      strong { color: #e8b49c; }
      #clock { font-variant-numeric: tabular-nums; opacity: .8; }
      #mode { font-weight: 600; }
      #mode.interactive { color: #f6c76b; }
      .row { display: flex; gap: 12px; align-items: center; font-variant-numeric: tabular-nums; }
      button { font: inherit; color: inherit; background: #2a2230; border: 1px solid #5a4652; border-radius: 6px; padding: 3px 10px; }
      button:active { background: #3a2e40; }
      #hover { padding: 2px 8px; border-radius: 6px; border: 1px dashed #5a4652; }
      #hover.on { background: #3a2e40; }
      small { opacity: .6; }
    </style>
  </head>
  <body>
    <header><strong>TrueMain overlay spike</strong><span id="clock">--:--:--</span></header>
    <div>Mouse: <span id="mode">click-through</span></div>
    <div class="row">
      <button id="click">Click me</button><span>clicks <b id="clicks">0</b></span>
      <span id="hover">hover <b id="hovers">0</b></span>
    </div>
    <small>ctrl+shift+O show/hide · ctrl+shift+I toggle mouse</small>
    <script>
      const $ = (id) => document.getElementById(id)
      const tick = () => { $('clock').textContent = new Date().toLocaleTimeString() }
      tick(); setInterval(tick, 250)
      let clicks = 0, hovers = 0
      $('click').addEventListener('click', () => { $('clicks').textContent = ++clicks })
      $('hover').addEventListener('mouseenter', () => { $('hover').classList.add('on'); $('hovers').textContent = ++hovers })
      $('hover').addEventListener('mouseleave', () => $('hover').classList.remove('on'))
      window.overlaySpike = {
        setMode(mode) { $('mode').textContent = mode; $('mode').className = mode }
      }
    </script>
  </body>
</html>
