<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <!-- The schema.org `logo` for the Organization identity (nuxt.config.ts).
       Same M-check tracing as truemain-mark.svg, kept as a separate file for
       one reason: Google requires the logo to be at least 112x112, and a
       viewBox-only SVG has no intrinsic size for that check to read. Hence the
       explicit width/height here — the in-app mark must stay dimensionless so
       CSS keeps sizing it. Any change to the mark's path or ramp belongs in
       both files. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2cfa6"/>
      <stop offset="0.55" stop-color="#e2917e"/>
      <stop offset="1" stop-color="#8a3b44"/>
    </linearGradient>
  </defs>
  <path d="M13 47V21l15 17L51 15" fill="none" stroke="url(#g)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
