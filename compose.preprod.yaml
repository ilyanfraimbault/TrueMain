# Shared by both ingestor lanes (#1362). The pipeline runs as two processes: a fetch lane
# that spends the Riot API budget and an aggregate lane that turns what it wrote into
# aggregates. They have opposite bottlenecks — network versus Postgres — so chaining them
# left the API key idle through every aggregation and the aggregates waiting behind ~55
# minutes of HTTP. Everything except the mode and the cadence is identical, so it is
# declared once here; a knob one lane does not use is simply bound and ignored.
x-ingestor-environment: &ingestor-environment
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__TrueMain: Host=pgbouncer;Port=6432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Command Timeout=300;Maximum Pool Size=40;No Reset On Close=true;Application Name=truemain-ingestor
      MongoLogging__ConnectionString: "mongodb://${MONGO_USER:?set MONGO_USER before deploying}:${MONGO_PASSWORD:?set MONGO_PASSWORD before deploying}@mongo:27017/?authSource=admin"
      Riot__ApiKey: ${RIOT_API_KEY}
      MongoLogging__CrashFilePath: /home/app/crashes
      MongoLogging__LogsRetention: "30.00:00:00"
      MatchDataRetention__RetainedPatchCount: "1"
      MatchDataRetention__AggregateRetainedPatchCount: "2"
      ManualSeed__BatchSize: "250"
      Discovery__MaxAccountsPerPlatformPerRun: "100"
      Discovery__NewAccountsTarget: "15"
      Scoring__TopNPerPlatform: "50"
      Harvest__MaxCandidatesPerRun: "500"
      MatchIngestion__BatchSize: "25"
      MatchIngestion__MatchesPerAccount: "10"
      MainAnalysis__MatchesToConsider: "30"
      MainAnalysis__MinMatchesToEvaluate: "10"
      # Fold the non-main population too, so the truemains toggle has both sides
      # to show (#1346). Gated per environment (#1349) because this multiplies the
      # aggregation's source rows and that process once OOM-killed a VPS (#601) —
      # preprod is where the capacity question gets answered before prod. Measured
      # here on 2026-09-01: the widened fold ran at ~250 MB RSS with no restart and
      # no OOM, and produced 16.6k non-main scopes on the live patch alongside
      # 20.9k main ones.
      MainAnalysis__AggregateNonMainPopulation: "true"

services:
  postgres:
    image: postgres:17.2
    container_name: truemain-preprod-postgres
    restart: unless-stopped
    # Raised from 256m for the same reason as prod: shared segments for worker memory,
    # and 256m is what got exhausted in #589.
    shm_size: "1g"
    # Postgres server tuning — part A of #1366.
    #
    # Same shape as compose.prod.yaml, roughly halved: preprod is a smaller host (96 GB
    # disk, ~11 GB database) and it shares the box with the whole preprod stack, so it
    # cannot claim the memory prod's Postgres gets as the dominant tenant. The host's RAM
    # was not measured and no share of it is budgeted to Postgres alone, so these values
    # are deliberately conservative rather than derived; revisit them with a real
    # measurement if preprod turns out to have headroom. Keeping the
    # same *settings* (not the same values) means preprod still exercises the tuned plans
    # — jit off, flash-priced random access, work_mem large enough not to spill — before
    # prod does.
    #
    # DO NOT REMOVE max_parallel_workers_per_gather=0. It is the deliberate fix for the
    # /dev/shm exhaustion incident (#589): parallel workers on the aggregate-pattern
    # queries exhausted the shared memory segment, Postgres raised 53100 and the API and
    # ingestor crash-looped. Re-enabling parallelism reproduces that outage.
    command:
      - "postgres"
      # Memory (≈ half of prod)
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=5GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "hash_mem_multiplier=2"
      - "-c"
      - "maintenance_work_mem=512MB"
      # Planner — NVMe, not spinning rust
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "jit=off"
      # Parallelism — see the warning above (#589)
      - "-c"
      - "max_parallel_workers_per_gather=0"
      # WAL / checkpoints (smaller: preprod's disk is the scarce resource here)
      - "-c"
      - "wal_compression=lz4"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      # Autovacuum
      - "-c"
      - "autovacuum_vacuum_cost_delay=2ms"
      - "-c"
      - "autovacuum_vacuum_scale_factor=0.05"
      - "-c"
      - "autovacuum_analyze_scale_factor=0.02"
      # Statement-level visibility (extension created by an EF migration)
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=5000"
      - "-c"
      - "pg_stat_statements.track=top"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - truemain_preprod_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - truemain_internal

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: truemain-preprod-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      STATS_USERS: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - truemain_internal

  mongo:
    image: mongo:8.2.12
    container_name: truemain-preprod-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - truemain_preprod_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - truemain_internal

  api:
    image: ghcr.io/ilyanfraimbault/truemain-api:${IMAGE_TAG:-preprod}
    pull_policy: always
    container_name: truemain-preprod-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrationsOnStartup: "false"
      ConnectionStrings__TrueMain: Host=pgbouncer;Port=6432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Command Timeout=300;Maximum Pool Size=100;No Reset On Close=true;Application Name=truemain-api
      ConnectionStrings__TrueMainMigrations: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Command Timeout=300;Application Name=truemain-migrator
      MongoLogging__ConnectionString: "mongodb://${MONGO_USER:?set MONGO_USER before deploying}:${MONGO_PASSWORD:?set MONGO_PASSWORD before deploying}@mongo:27017/?authSource=admin"
      Ops__ApiKey: "${OPS_API_KEY:?set OPS_API_KEY before deploying}"
      # Volume size the storage forecast projects against (#925). Unset means no
      # forecast at all — the admin panel says so rather than fitting a line to a
      # guessed capacity. Set STORAGE_DISK_CAPACITY_BYTES to the real disk size.
      StorageHistory__DiskCapacityBytes: "${STORAGE_DISK_CAPACITY_BYTES:-0}"
      Cors__Origins__0: "http://localhost:3001"
      MongoLogging__CrashFilePath: /home/app/crashes
      MongoLogging__LogsRetention: "30.00:00:00"
    volumes:
      - truemain_preprod_api_crashes:/home/app/crashes
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - truemain_internal

  web:
    image: ghcr.io/ilyanfraimbault/truemain-web:${IMAGE_TAG:-preprod}
    pull_policy: always
    container_name: truemain-preprod-web
    restart: unless-stopped
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_API_BASE_URL: http://api:8080
      # Build stamp shown small in the footer, so preprod says which build it is
      # running instead of forcing a SHA comparison on GitHub. APP_VERSION is
      # appended to the env by the deploy job (the prerelease this deploy
      # resolved, e.g. 1.20.0-rc.4); empty on a manual redeploy, which just
      # hides the label.
      NUXT_PUBLIC_APP_ENV: preprod
      NUXT_PUBLIC_APP_VERSION: ${APP_VERSION:-}
      NUXT_PUBLIC_UMAMI_HOST: ${UMAMI_PUBLIC_URL:-}
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3000"
    networks:
      - truemain_internal

  admin:
    image: ghcr.io/ilyanfraimbault/truemain-admin:${IMAGE_TAG:-preprod}
    pull_policy: always
    container_name: truemain-preprod-admin
    restart: unless-stopped
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_OPS_API_BASE_URL: http://api:8080
      NUXT_OPS_KEY: ${OPS_API_KEY}
      NUXT_SESSION_PASSWORD: "${ADMIN_SESSION_PASSWORD:?set ADMIN_SESSION_PASSWORD before deploying}"
      NUXT_ADMIN_USERNAME: ${ADMIN_USERNAME:-truemain}
      NUXT_ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD before deploying - admin is exposed on 0.0.0.0}"
      NUXT_SESSION_COOKIE_SECURE: "false"
      NUXT_TRUST_PROXY: "false"
      NUXT_PUBLIC_UMAMI_URL: ${UMAMI_PUBLIC_URL:-}
      NUXT_PUBLIC_UMAMI_SHARE_URL: ${UMAMI_SHARE_URL:-}
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3002:3000"
    networks:
      - truemain_internal

  ingestor:
    image: ghcr.io/ilyanfraimbault/truemain-ingestor:${IMAGE_TAG:-preprod}
    pull_policy: always
    container_name: truemain-preprod-ingestor
    restart: unless-stopped
    environment:
      <<: *ingestor-environment
      # The Riot-bound half of the pipeline (#1362). Left on the default RunOnce loop:
      # its passes are back-to-back, paced by the per-routing-value rate limiter rather
      # than by a timer.
      Job__Mode: ${INGESTOR_JOB_MODE:-FetchLane}
    volumes:
      - truemain_preprod_ingestor_crashes:/home/app/crashes
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - truemain_internal

  ingestor-aggregate:
    image: ghcr.io/ilyanfraimbault/truemain-ingestor:${IMAGE_TAG:-preprod}
    pull_policy: always
    container_name: truemain-preprod-ingestor-aggregate
    restart: unless-stopped
    environment:
      <<: *ingestor-environment
      # The Postgres-bound half (#1362): everything that reads what the fetch lane wrote,
      # plus retention and the storage snapshot. On a timer rather than back-to-back —
      # there is nothing to gain from re-folding the same rows the moment a pass ends, and
      # a fixed cadence is what makes "how stale can an aggregate be?" answerable.
      Job__Mode: ${INGESTOR_AGGREGATE_JOB_MODE:-AggregateLane}
      Job__RunOnce: "false"
      Job__IntervalMinutes: "${INGESTOR_AGGREGATE_INTERVAL_MINUTES:-20}"
      ConnectionStrings__TrueMain: Host=pgbouncer;Port=6432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Command Timeout=300;Maximum Pool Size=40;No Reset On Close=true;Application Name=truemain-ingestor-aggregate
    volumes:
      # Its own volume: two containers writing crash dumps to one path would race on the
      # file the crash reporter writes before it reaches Mongo.
      - truemain_preprod_ingestor_aggregate_crashes:/home/app/crashes
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - truemain_internal

  umami-db:
    image: postgres:17.2
    container_name: truemain-preprod-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: "${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD before deploying}"
      POSTGRES_DB: umami
    volumes:
      - truemain_preprod_umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - truemain_internal

  umami:
    image: umamisoftware/umami:3.3.1
    container_name: truemain-preprod-umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: "${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET before deploying}"
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - truemain_internal

  # Umami self-hosted has no built-in retention for session replay/heatmap
  # data (#1018) — without this, session_replay/heatmap_event grow unbounded,
  # the heaviest tables Umami writes. Postgres image with the entrypoint
  # overridden to just run the purge script on a loop, no server started.
  umami-replay-cleanup:
    image: postgres:17.2-alpine
    container_name: truemain-preprod-umami-replay-cleanup
    restart: unless-stopped
    environment:
      PGPASSWORD: "${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD before deploying}"
      RETENTION_DAYS: ${UMAMI_REPLAY_RETENTION_DAYS:-7}
    user: postgres
    entrypoint: ["sh", "/cleanup.sh"]
    configs:
      - source: umami_replay_cleanup_script
        target: /cleanup.sh
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - truemain_internal

  umami-proxy:
    image: caddy:2-alpine
    container_name: truemain-preprod-umami-proxy
    restart: unless-stopped
    environment:
      UMAMI_ALLOWED_FRAME_ORIGIN: ${UMAMI_ALLOWED_FRAME_ORIGIN:-}
    configs:
      - source: umami_proxy_caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - "3100:3100"
    depends_on:
      - umami
    networks:
      - truemain_internal

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: truemain-preprod-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5051:80"
    volumes:
      - truemain_preprod_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - truemain_internal

configs:
  umami_proxy_caddyfile:
    content: |
      {
      	auto_https off
      }

      :3100 {
      	reverse_proxy umami:3000 {
      		header_down Content-Security-Policy "frame-ancestors 'self'" "frame-ancestors 'self' {$$UMAMI_ALLOWED_FRAME_ORIGIN}"
      	}
      }

  umami_replay_cleanup_script:
    content: |
      #!/bin/sh
      set -eu
      while true; do
        if psql -h umami-db -U umami -d umami -v ON_ERROR_STOP=1 -c \
          "DELETE FROM session_replay WHERE created_at < now() - interval '$${RETENTION_DAYS} days'; DELETE FROM heatmap_event WHERE created_at < now() - interval '$${RETENTION_DAYS} days';"; then
          echo "$$(date -Iseconds) purged replay/heatmap rows older than $${RETENTION_DAYS} days"
        else
          echo "$$(date -Iseconds) purge failed, will retry next cycle" >&2
        fi
        sleep 86400
      done

volumes:
  truemain_preprod_db_data:
    name: truemain_preprod_db_data
  truemain_preprod_mongo_data:
    name: truemain_preprod_mongo_data
  truemain_preprod_pgadmin_data:
    name: truemain_preprod_pgadmin_data
  truemain_preprod_api_crashes:
    name: truemain_preprod_api_crashes
  truemain_preprod_ingestor_crashes:
    name: truemain_preprod_ingestor_crashes
  truemain_preprod_ingestor_aggregate_crashes:
    name: truemain_preprod_ingestor_aggregate_crashes
  truemain_preprod_umami_db_data:
    name: truemain_preprod_umami_db_data

networks:
  truemain_internal:
    name: truemain_preprod_internal
    driver: bridge
