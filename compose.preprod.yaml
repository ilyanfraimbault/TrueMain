x-ingestor-environment: &ingestor-environment
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__TrueMain: Host=pgbouncer;Port=6432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Command Timeout=300;Maximum Pool Size=5;No Reset On Close=true;Application Name=truemain-ingestor
      MongoLogging__ConnectionString: "mongodb://${MONGO_USER:?set MONGO_USER before deploying}:${MONGO_PASSWORD:?set MONGO_PASSWORD before deploying}@mongo:27017/?authSource=admin"
      Riot__ApiKey: ${RIOT_API_KEY}
      MongoLogging__CrashFilePath: /home/app/crashes
      MongoLogging__LogsRetention: "30.00:00:00"
      MatchDataRetention__RetainedPatchCount: "1"
      MatchDataRetention__AggregateRetainedPatchCount: "2"
      MatchDataRetention__BuildAggregateRetainedPatchCount: "2"
      ManualSeed__BatchSize: "250"
      Discovery__MaxAccountsPerPlatformPerRun: "100"
      Discovery__NewAccountsTarget: "15"
      Scoring__TopNPerPlatform: "50"
      Harvest__MaxCandidatesPerRun: "500"
      MatchIngestion__BatchSize: "25"
      MatchIngestion__MatchesPerAccount: "10"
      MainAnalysis__MatchesToConsider: "30"
      MainAnalysis__MinMatchesToEvaluate: "10"
      MainAnalysis__AggregateNonMainPopulation: "true"

services:
  postgres:
    image: postgres:17.2
    container_name: truemain-preprod-postgres
    restart: unless-stopped
    cpus: 1.5
    cpu_shares: 2048
    shm_size: "1g"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=5GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "hash_mem_multiplier=2"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "jit=off"
      - "-c"
      - "max_parallel_workers_per_gather=0"
      - "-c"
      - "wal_compression=lz4"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "autovacuum_vacuum_cost_delay=2ms"
      - "-c"
      - "autovacuum_vacuum_scale_factor=0.05"
      - "-c"
      - "autovacuum_analyze_scale_factor=0.02"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=5000"
      - "-c"
      - "pg_stat_statements.track=top"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - truemain_preprod_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - truemain_internal

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: truemain-preprod-pgbouncer
    restart: unless-stopped
    cpus: 0.5
    cpu_shares: 1024
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_TYPE: scram-sha-256
    configs:
      - source: pgbouncer_ini
        target: /etc/pgbouncer/pgbouncer.ini
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - truemain_internal

  mongo:
    image: mongo:8.3.11
    container_name: truemain-preprod-mongo
    restart: unless-stopped
    cpus: 0.75
    cpu_shares: 1024
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - truemain_preprod_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 60s
      timeout: 20s
      retries: 8
      start_period: 180s
    networks:
      - truemain_internal

  api:
    image: ghcr.io/ilyanfraimbault/truemain-api:${IMAGE_TAG:-preprod}
    pull_policy: always
    container_name: truemain-preprod-api
    restart: unless-stopped
    cpus: 1.0
    cpu_shares: 1024
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrationsOnStartup: "false"
      ConnectionStrings__TrueMain: Host=pgbouncer;Port=6432;Database=${POSTGRES_DB}_api;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Command Timeout=65;Maximum Pool Size=22;No Reset On Close=true;Application Name=truemain-api
      ConnectionStrings__TrueMainMigrations: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Command Timeout=300;Application Name=truemain-migrator
      MongoLogging__ConnectionString: "mongodb://${MONGO_USER:?set MONGO_USER before deploying}:${MONGO_PASSWORD:?set MONGO_PASSWORD before deploying}@mongo:27017/?authSource=admin"
      Ops__ApiKey: "${OPS_API_KEY:?set OPS_API_KEY before deploying}"
      LogIngest__ApiKey: ${LOG_INGEST_KEY:-}
      StorageHistory__DiskCapacityBytes: "${STORAGE_DISK_CAPACITY_BYTES:-0}"
      RateLimit__PermitLimit: "${RATE_LIMIT_PERMITS:-500}"
      RateLimit__WindowSeconds: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      RateLimit__QueueLimit: "${RATE_LIMIT_QUEUE:-10}"
      Cors__Origins__0: "${PREPROD_SITE_URL:?set PREPROD_SITE_URL before deploying}"
      Cors__Origins__1: "${PREPROD_ADMIN_URL:?set PREPROD_ADMIN_URL before deploying}"
      MongoLogging__CrashFilePath: /home/app/crashes
      MongoLogging__LogsRetention: "30.00:00:00"
    volumes:
      - truemain_preprod_api_crashes:/home/app/crashes
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - truemain_internal

  web:
    image: ghcr.io/ilyanfraimbault/truemain-web:${IMAGE_TAG:-preprod}
    pull_policy: always
    container_name: truemain-preprod-web
    restart: unless-stopped
    cpus: 0.75
    cpu_shares: 512
    init: true
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NITRO_CLUSTER_WORKERS: "1"
      NUXT_API_BASE_URL: http://api:8080
      NUXT_LOG_INGEST_KEY: ${LOG_INGEST_KEY:-}
      NUXT_DESKTOP_CHANNEL: beta
      NUXT_PUBLIC_APP_ENV: preprod
      NUXT_PUBLIC_APP_VERSION: ${APP_VERSION:-}
      NUXT_PUBLIC_SITE_URL: "${PREPROD_SITE_URL:?set PREPROD_SITE_URL before deploying}"
      NUXT_PUBLIC_UMAMI_HOST: ${UMAMI_PUBLIC_URL:-}
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - truemain_internal
      - truemain_edge

  admin:
    image: ghcr.io/ilyanfraimbault/truemain-admin:${IMAGE_TAG:-preprod}
    pull_policy: always
    container_name: truemain-preprod-admin
    restart: unless-stopped
    cpus: 0.5
    cpu_shares: 256
    init: true
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_OPS_API_BASE_URL: http://api:8080
      NUXT_OPS_KEY: ${OPS_API_KEY}
      NUXT_LOG_INGEST_KEY: ${LOG_INGEST_KEY:-}
      NUXT_SESSION_PASSWORD: "${ADMIN_SESSION_PASSWORD:?set ADMIN_SESSION_PASSWORD before deploying}"
      NUXT_ADMIN_USERNAME: ${ADMIN_USERNAME:-truemain}
      NUXT_ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD before deploying - admin is exposed on 0.0.0.0}"
      NUXT_SESSION_COOKIE_SECURE: "false"
      NUXT_TRUST_PROXY: "true"
      NUXT_PUBLIC_UMAMI_URL: ${UMAMI_PUBLIC_URL:-}
      NUXT_PUBLIC_UMAMI_SHARE_URL: ${UMAMI_SHARE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - truemain_internal
      - truemain_edge

  ingestor:
    image: ghcr.io/ilyanfraimbault/truemain-ingestor:${IMAGE_TAG:-preprod}
    pull_policy: always
    container_name: truemain-preprod-ingestor
    restart: unless-stopped
    cpus: 0.75
    cpu_shares: 512
    init: true
    stop_grace_period: 120s
    environment:
      <<: *ingestor-environment
      Job__Mode: ${INGESTOR_JOB_MODE:-FetchWorkers}
      Job__RunOnce: "${INGESTOR_RUN_ONCE:-false}"
      Job__IntervalMinutes: "${INGESTOR_MAINTENANCE_INTERVAL_MINUTES:-1}"
      MatchFetchWorkers__RampStage: "${INGESTOR_FETCH_RAMP_STAGE:-1}"
      IngestionBackpressure__MinAvailableMemoryPercent: "${INGESTOR_BACKPRESSURE_MIN_AVAILABLE_MEMORY_PERCENT:-10}"
      IngestionBackpressure__MinFreeDiskPercent: "${INGESTOR_BACKPRESSURE_MIN_FREE_DISK_PERCENT:-15}"
      IngestionBackpressure__DrillMinutes: "${INGESTOR_BACKPRESSURE_DRILL_MINUTES:-0}"
    volumes:
      - truemain_preprod_ingestor_crashes:/home/app/crashes
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - truemain_internal

  ingestor-aggregate:
    image: ghcr.io/ilyanfraimbault/truemain-ingestor:${IMAGE_TAG:-preprod}
    pull_policy: always
    container_name: truemain-preprod-ingestor-aggregate
    restart: unless-stopped
    cpus: 0.75
    cpu_shares: 256
    init: true
    stop_grace_period: 120s
    environment:
      <<: *ingestor-environment
      Job__Mode: ${INGESTOR_AGGREGATE_JOB_MODE:-AggregateLane}
      Job__RunOnce: "false"
      Job__IntervalMinutes: "${INGESTOR_AGGREGATE_INTERVAL_MINUTES:-120}"
      ConnectionStrings__TrueMain: Host=pgbouncer;Port=6432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Command Timeout=300;Maximum Pool Size=3;No Reset On Close=true;Application Name=truemain-ingestor-aggregate
    volumes:
      - truemain_preprod_ingestor_aggregate_crashes:/home/app/crashes
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - truemain_internal

  umami-db:
    image: postgres:17.2
    container_name: truemain-preprod-umami-db
    restart: unless-stopped
    cpus: 0.5
    cpu_shares: 1024
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: "${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD before deploying}"
      POSTGRES_DB: umami
    volumes:
      - truemain_preprod_umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 60s
      timeout: 10s
      retries: 8
      start_period: 180s
    networks:
      - truemain_internal

  umami:
    image: umamisoftware/umami:3.4.0
    container_name: truemain-preprod-umami
    restart: unless-stopped
    cpus: 0.5
    cpu_shares: 1024
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: "${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET before deploying}"
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - truemain_internal

  umami-replay-cleanup:
    image: postgres:17.2-alpine
    container_name: truemain-preprod-umami-replay-cleanup
    restart: unless-stopped
    cpus: 0.25
    cpu_shares: 128
    environment:
      PGPASSWORD: "${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD before deploying}"
      RETENTION_DAYS: ${UMAMI_REPLAY_RETENTION_DAYS:-7}
      DATA_RETENTION_MONTHS: ${UMAMI_DATA_RETENTION_MONTHS:-25}
    user: postgres
    entrypoint: ["sh", "/cleanup.sh"]
    configs:
      - source: umami_replay_cleanup_script
        target: /cleanup.sh
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - truemain_internal

  umami-proxy:
    image: caddy:2-alpine
    container_name: truemain-preprod-umami-proxy
    restart: unless-stopped
    cpus: 0.25
    cpu_shares: 512
    environment:
      UMAMI_ALLOWED_FRAME_ORIGIN: ${UMAMI_ALLOWED_FRAME_ORIGIN:-}
    configs:
      - source: umami_proxy_caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - "3100:3100"
    depends_on:
      - umami
    networks:
      - truemain_internal

configs:
  pgbouncer_ini:
    content: |
      [databases]
      ${POSTGRES_DB} = host=postgres port=5432 auth_user=${POSTGRES_USER} pool_size=8 max_db_connections=8 connect_query='SET idle_in_transaction_session_timeout = 60000'
      ${POSTGRES_DB}_api = host=postgres port=5432 dbname=${POSTGRES_DB} auth_user=${POSTGRES_USER} pool_size=22 max_db_connections=22 connect_query='SET idle_in_transaction_session_timeout = 60000; SET statement_timeout = 60000'

      [pgbouncer]
      listen_addr = 0.0.0.0
      listen_port = 6432
      unix_socket_dir =
      auth_file = /etc/pgbouncer/userlist.txt
      auth_type = scram-sha-256
      pool_mode = transaction
      max_client_conn = 1000
      min_pool_size = 5
      reserve_pool_size = 0
      max_user_connections = 30
      query_wait_timeout = 30
      ignore_startup_parameters = extra_float_digits
      admin_users = postgres
      stats_users = ${POSTGRES_USER}
  umami_proxy_caddyfile:
    content: |
      {
      	auto_https off
      }

      :3100 {
      	reverse_proxy umami:3000 {
      		header_down Content-Security-Policy "frame-ancestors 'self'" "frame-ancestors 'self' {$$UMAMI_ALLOWED_FRAME_ORIGIN}"
      	}
      }

  umami_replay_cleanup_script:
    content: |
      #!/bin/sh
      set -eu
      while true; do
        if psql -h umami-db -U umami -d umami -X -v ON_ERROR_STOP=1 --single-transaction \
          -v replay_days="$${RETENTION_DAYS}" -v data_months="$${DATA_RETENTION_MONTHS}" <<'SQL'
      DELETE FROM session_replay WHERE created_at < now() - make_interval(days => :'replay_days'::int);
      DELETE FROM heatmap_event WHERE created_at < now() - make_interval(days => :'replay_days'::int);
      DELETE FROM event_data WHERE created_at < now() - make_interval(months => :'data_months'::int);
      DELETE FROM revenue WHERE created_at < now() - make_interval(months => :'data_months'::int);
      DELETE FROM session_data WHERE created_at < now() - make_interval(months => :'data_months'::int);
      DELETE FROM session_link WHERE created_at < now() - make_interval(months => :'data_months'::int);
      DELETE FROM website_event WHERE created_at < now() - make_interval(months => :'data_months'::int);
      DELETE FROM session s WHERE s.created_at < now() - make_interval(months => :'data_months'::int)
        AND NOT EXISTS (SELECT 1 FROM website_event e WHERE e.session_id = s.session_id);
      UPDATE website_event SET referrer_domain = NULL, referrer_path = NULL, referrer_query = NULL
        WHERE (referrer_domain IS NULL AND (referrer_path IS NOT NULL OR referrer_query IS NOT NULL))
          OR referrer_domain = regexp_replace(lower(hostname), '^www\.', '');
      UPDATE website_event SET referrer_path = '/', referrer_query = ''
        WHERE referrer_domain IS NOT NULL
          AND (referrer_path IS DISTINCT FROM '/' OR referrer_query IS DISTINCT FROM '');
      UPDATE website_event SET utm_source = NULL, utm_medium = NULL, utm_campaign = NULL, utm_content = NULL,
          utm_term = NULL, gclid = NULL, fbclid = NULL, msclkid = NULL, ttclid = NULL, li_fat_id = NULL, twclid = NULL,
          url_query = trim(both '&' from regexp_replace(url_query, '(^|&)(utm(_|%5f)[^=&]*|gclid|gbraid|wbraid|dclid|fbclid|msclkid|ttclid|li_fat_id|twclid|igshid|yclid|mc_cid|mc_eid)(=[^&]*)?(?=&|$$)', '', 'gi'))
        WHERE coalesce(utm_source, utm_medium, utm_campaign, utm_content, utm_term,
            gclid, fbclid, msclkid, ttclid, li_fat_id, twclid) IS NOT NULL
          OR url_query ~* '(^|&)(utm(_|%5f)[^=&]*|gclid|gbraid|wbraid|dclid|fbclid|msclkid|ttclid|li_fat_id|twclid|igshid|yclid|mc_cid|mc_eid)(=[^&]*)?(&|$$)';
      SQL
        then
          echo "$$(date -Iseconds) purged replay/heatmap rows older than $${RETENTION_DAYS} days, data older than $${DATA_RETENTION_MONTHS} months; scrubbed referrer paths and campaign ids"
        else
          echo "$$(date -Iseconds) purge failed, will retry next cycle" >&2
        fi
        sleep 86400
      done

volumes:
  truemain_preprod_db_data:
    name: truemain_preprod_db_data
  truemain_preprod_mongo_data:
    name: truemain_preprod_mongo_data
  truemain_preprod_api_crashes:
    name: truemain_preprod_api_crashes
  truemain_preprod_ingestor_crashes:
    name: truemain_preprod_ingestor_crashes
  truemain_preprod_ingestor_aggregate_crashes:
    name: truemain_preprod_ingestor_aggregate_crashes
  truemain_preprod_umami_db_data:
    name: truemain_preprod_umami_db_data

networks:
  truemain_internal:
    name: truemain_preprod_internal
    driver: bridge
  truemain_edge:
    name: truemain_preprod_edge
    driver: bridge
